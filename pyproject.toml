[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentspec"
version = "0.1.0"
description = "Agent orchestration and harness tooling for OpenSpec-driven development."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "rbatistadev" }
]
dependencies = []

[project.scripts]
agentspec = "agentspec.cli:main"

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentspec"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "PL",
    "RUF",
]
